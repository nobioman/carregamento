<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carregando…</title>
  <style>
    :root {
      --fundo: #ffffff;
      --branco: #EC0075;
      --duracao: 7s; /* tempo total do carregamento */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--fundo);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Tela de carregamento */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--fundo);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      z-index: 9999;
      transition: opacity .6s ease, visibility .6s ease;
    }

    #loader.oculto {
      opacity: 0;
      visibility: hidden;
    }

    /* Logo centralizada */
    .logo {
      width: min(220px, 50vw);
      height: min(220px, 50vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Barra de progresso */
    .barra {
      width: min(320px, 70vw);
      height: 8px;
      background: rgba(255, 255, 255, .3);
      border-radius: 999px;
      overflow: hidden;
    }

    .barra-preenchimento {
      height: 100%;
      width: 0;
      background: var(--branco);
      border-radius: 999px;
      animation: carregar var(--duracao) linear forwards;
    }

    @keyframes carregar {
      from { width: 0; }
      to   { width: 100%; }
    }

    /* Conteúdo da página (aparece após o carregamento) */
    main {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--branco);
      font-size: 1.5rem;
    }

    @media (prefers-reduced-motion: reduce) {
      #loader { transition: none; }
    }
  </style>
</head>
<body>

  <!-- TELA DE CARREGAMENTO -->
  <div id="loader">
    <div class="logo">
      <!-- Troque "logo.png" pelo caminho da sua imagem -->
      <img src="./images/logoo.png" alt="Logo">
    </div>
    <div class="barra" role="progressbar" aria-label="Carregando">
      <div class="barra-preenchimento"></div>
    </div>
  </div>

  <!-- CONTEÚDO DO SITE -->
  <main>
    <h1>Bem-vindo!</h1>
  </main>

  <script>
    // Coloque aqui o link para onde o visitante será direcionado
    const LINK_DESTINO = "https://atendimentoonline-pi.vercel.app/";

    // Após 7 segundos, redireciona para o link
    setTimeout(function () {
      window.location.href = LINK_DESTINO;
    }, 7000);
  </script>
</body>
</html>
