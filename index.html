
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#EC0075">
    <title>Carregando...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #EC0075;
            overflow: hidden;
        }

        /* Tela inteira */
        .loading-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Logo centralizada */
        .logo {
            display: block;
            width: 180px;
            height: 180px;
            max-width: 70vw;
            max-height: 40vh;
            object-fit: contain;

            animation: aparecer 1s ease-in-out;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <main class="loading-screen">

        <!-- SUA LOGO -->
        <img
            id="logo"
            class="logo"
            src="logoatendente.jpg"
            alt="Logo"
        >

    </main>

    <script>
        // ==================================
        // CONFIGURAÇÕES
        // ==================================

        // Altere para o endereço desejado
        const linkDestino = "https://nobioman.github.io/etapa03/";

        // Tempo de espera: 8 segundos
        const tempoCarregamento = 8000;

        // ==================================
        // ESCOLHER SUA IMAGEM DE LOGO
        // ==================================

        const seletorLogo = document.createElement("input");
        seletorLogo.type = "file";
        seletorLogo.accept = "images/logoatendente.jpg*";
        seletorLogo.style.display = "none";
        document.body.appendChild(seletorLogo);

        // Permite selecionar uma imagem ao clicar
        document.getElementById("logo").style.cursor = "pointer";

        document.getElementById("logo").addEventListener("click", () => {
            seletorLogo.click();
        });

        seletorLogo.addEventListener("change", (evento) => {
            const arquivo = evento.target.files[0];

            if (arquivo && arquivo.type.startsWith("image/")) {
                const leitor = new FileReader();

                leitor.onload = (e) => {
                    document.getElementById("logo").src = e.target.result;
                };

                leitor.readAsDataURL(arquivo);
            }
        });

        // ==================================
        // REDIRECIONAMENTO AUTOMÁTICO
        // ==================================

        setTimeout(() => {
            window.location.replace(linkDestino);
        }, tempoCarregamento);
    </script>

</body>
</html>
