
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#EC0075">
    <title>Carregando...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #EC0075;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loading-bar {
            width: 150px;
            height: 4px;
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background-color: #FFFFFF;
            border-radius: 10px;
            animation: progress 8s linear forwards;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.06);
                opacity: 0.8;
            }
        }

        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }

        @media (max-width: 480px) {
            .logo {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>

<body>

    <main class="loading-container">
        <img
            src="logoatendente.jpg"
            alt="Logo"
            class="logo"
        >

        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </main>

    <script>
        // LINK DE DESTINO
        const linkDestino = "https://www.google.com";

        // TEMPO DE CARREGAMENTO: 8 SEGUNDOS
        const tempoCarregamento = 8000;

        // REDIRECIONAMENTO AUTOMÁTICO
        setTimeout(function () {
            window.location.replace(linkDestino);
        }, tempoCarregamento);
    </script>

</body>
</html>
